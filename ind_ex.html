<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptRefine | Safe & Free</title>
    <style>
        :root { --accent: #00ff88; --bg: #0a0a0a; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { width: 90%; max-width: 500px; background: #1a1a1a; padding: 30px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: var(--accent); font-weight: 800; }
        textarea { width: 100%; height: 100px; background: #000; border: 1px solid #444; border-radius: 10px; color: #fff; padding: 12px; margin: 15px 0; box-sizing: border-box; resize: none; }
        button { background: var(--accent); color: #000; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #output { margin-top: 20px; padding: 15px; background: #000; border-radius: 10px; border-left: 3px solid var(--accent); font-size: 14px; line-height: 1.5; white-space: pre-wrap; min-height: 50px; color: #bbb; }
    </style>
</head>
<body>

<div class="card">
    <h2>PromptRefine</h2>
    <p style="font-size: 12px; color: #888;">Redrafts your prompt for better ML performance using Mistral-7B.</p>
    
    <textarea id="userInput" placeholder="Enter a simple prompt..."></textarea>
    
    <button id="mainBtn" onclick="process()">REFINE PROMPT</button>

    <div id="output">Result will appear here...</div>
</div>

<script>
    async function process() {
        const input = document.getElementById('userInput').value;
        const out = document.getElementById('output');
        const btn = document.getElementById('mainBtn');

        if(!input.trim()) return alert("Please enter a prompt.");

        btn.disabled = true;
        out.innerText = "Connecting to ML Model...";

        try {
            // Call the secure backend endpoint
            const response = await fetch("/api/refine", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ prompt: input })
            });

            const data = await response.json();
            
            if (!response.ok) {
                out.innerText = data.error || "Error processing your request. Please try again.";
            } else {
                out.innerText = data.result;
            }
        } catch (err) {
            out.innerText = "Error: Unable to connect to the server. Please check your connection and try again.";
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
