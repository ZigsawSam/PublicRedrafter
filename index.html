<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptRefine</title>

    <style>
        :root {
            --accent: #00ff88;
            --bg: #0a0a0a;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            width: 90%;
            max-width: 500px;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #000;
            color: white;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            margin-top: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            background: #000;
            padding: 15px;
            border-radius: 10px;
            white-space: pre-wrap;
            min-height: 60px;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>PromptRefine</h2>

    <textarea
        id="userInput"
        placeholder="Enter prompt..."
    ></textarea>

    <button id="mainBtn">
        REFINE PROMPT
    </button>

    <div id="output">
        Result will appear here...
    </div>
</div>

<script>
const button = document.getElementById('mainBtn');

button.addEventListener('click', async () => {

    const prompt =
        document.getElementById('userInput').value;

    const output =
        document.getElementById('output');

    output.innerText = 'Processing...';

    try {

        const response = await fetch('/api/refine', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                prompt: prompt
            })
        });

        const text = await response.text();

        console.log(text);

        try {

            const data = JSON.parse(text);

            output.innerText =
                data.result ||
                data.error ||
                text;

        } catch {

            output.innerText = text;
        }

    } catch (error) {

        console.error(error);

        output.innerText =
            'ERROR: ' + error.toString();
    }
});
</script>

</body>
</html>
